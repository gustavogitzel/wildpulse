services:
  postgres:
    image: kartoza/postgis:15-3.3
    container_name: wildpulse-db
    restart: always
    environment:
      POSTGRES_DB: wildpulse
      POSTGRES_USER: postgres
      POSTGRES_PASS: postgres
      ALLOW_IP_RANGE: "0.0.0.0/0"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wildpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
